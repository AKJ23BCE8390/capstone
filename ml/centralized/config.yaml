dataset:
  name: "PneumoniaMNIST"
  centralized_dir: "./data/centralized"
  image_size: 64
  in_channels: 1
  num_classes: 2

training:
  batch_size: 32
  epochs: 15
  learning_rate: 0.001
  weight_decay: 0.0001
  seed: 42

paths:
  checkpoint_dir: "./models/checkpoints"
  model_save_name: "centralized_baseline.pt"
  metrics_save_name: "baseline_metrics.json"