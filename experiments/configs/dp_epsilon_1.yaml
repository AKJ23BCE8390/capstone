experiment:
  id: "EXP-05"
  name: "dp_fl_epsilon_1"
  rounds: 50
  num_clients: 4

data:
  dataset_name: "PneumoniaMNIST"
  clients_dir: "./data/clients"
  split_type: "dirichlet"
  dirichlet_alpha: 0.5
  batch_size: 32
  image_size: 64

model:
  architecture: "MedicalResNet18"
  in_channels: 1
  num_classes: 2

training:
  local_epochs: 5
  learning_rate: 0.001
  weight_decay: 0.0001

privacy:
  enabled: true
  target_epsilon: 1.0
  target_delta: 0.00001
  max_grad_norm: 1.0